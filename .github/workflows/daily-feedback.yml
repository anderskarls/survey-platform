name: Daglig Feedback-rapport

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1-5'  # Måndag–fredag kl 17:00 Stockholm (UTC+2)

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # Rapporten innehåller elevdata (elevnummer, fritextsvar, stödlistor) och får
    # ALDRIG committas - repot är publikt. Den levereras som artefakt i stället,
    # åtkomlig för repoägaren men utanför git-historiken.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check for new responses and generate report
        run: npx tsx scripts/generate-daily-report.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ladda upp rapporten som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: feedback-rapport
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
